<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2aabee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17212b" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:; connect-src 'self' blob: data:;">
<meta name="description" content="Ultra Messenger — offline-first PWA мессенджер">
<meta property="og:title" content="Ultra Messenger">
<meta property="og:description" content="Мессенджер уровня единорога в одном HTML">
<meta property="og:type" content="website">
<title>Ultra Messenger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232aabee'/><stop offset='1' stop-color='%231c8fcc'/></linearGradient></defs><circle cx='50' cy='50' r='48' fill='url(%23g)'/><path d='M30 40 L50 60 L70 40' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="styles/tokens.css?v=5">
<link rel="stylesheet" href="styles/base.css?v=5">
<link rel="stylesheet" href="styles/layout.css?v=5">
<link rel="stylesheet" href="styles/components.css?v=5">
<link rel="stylesheet" href="styles/animations.css?v=5">
</head>
<body>

<!-- SPLASH -->
<div id="splash" class="splash" role="dialog" aria-label="Загрузка">
  <div class="splash__logo" aria-hidden="true">
    <svg viewBox="0 0 100 100" width="96" height="96">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2aabee"/><stop offset="1" stop-color="#229ed9"/>
      </linearGradient></defs>
      <circle cx="50" cy="50" r="46" fill="url(#sg)"/>
      <path d="M30 40 L50 60 L70 40" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="splash__name">Ultra Messenger</div>
  <div class="splash__bar"><div class="splash__bar-fill" id="splashFill"></div></div>
</div>

<!-- AUTH -->
<section id="authScreen" class="auth" hidden aria-labelledby="authTitle">
  <div class="auth__card">
    <h1 id="authTitle" class="auth__title">Добро пожаловать</h1>
    <p class="auth__subtitle">Введите @username, чтобы войти</p>

    <label class="field">
      <span class="field__label">@username</span>
      <input id="authUsername" type="text" class="field__input" maxlength="32"
             autocomplete="username" placeholder="@Dimg7s" aria-describedby="authUsernameErr">
      <span id="authUsernameErr" class="field__err" role="alert"></span>
    </label>

    <div id="authNameBlock" hidden>
      <label class="field">
        <span class="field__label">Ваше имя</span>
        <input id="authName" type="text" class="field__input" maxlength="32"
               placeholder="Например: Джасур" aria-describedby="authNameErr">
        <span id="authNameErr" class="field__err" role="alert"></span>
      </label>

      <p class="auth__subtitle" style="margin-top: 16px;">Выберите аватар</p>
      <div class="auth__avatars" id="authAvatars" role="radiogroup" aria-label="Выбор аватара"></div>
    </div>

    <button id="authSubmit" class="btn btn--primary btn--block" disabled>Продолжить</button>

    <div id="authExistingHint" hidden class="auth__subtitle" style="text-align: center; margin-top: 8px;"></div>
  </div>
</section>

<!-- ONBOARDING -->
<div id="onboarding" class="onboarding" hidden role="dialog" aria-modal="true"></div>

<!-- APP -->
<main id="app" class="app" hidden>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" aria-label="Список чатов">
    <header class="sidebar__header">
      <button id="menuBtn" class="icon-btn" aria-label="Меню" title="Меню">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="search">
        <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" class="search__input" placeholder="Поиск" aria-label="Поиск">
        <button id="searchClear" class="search__clear" hidden aria-label="Очистить">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <nav class="filters" id="filters" role="tablist" aria-label="Фильтры">
      <button class="filter is-active" role="tab" aria-selected="true" data-filter="all">Все</button>
      <button class="filter" role="tab" aria-selected="false" data-filter="personal">Личные</button>
      <button class="filter" role="tab" aria-selected="false" data-filter="group">Группы</button>
      <button class="filter" role="tab" aria-selected="false" data-filter="channel">Каналы</button>
      <button class="filter" role="tab" aria-selected="false" data-filter="favorite">Избранное</button>
    </nav>

    <ul class="chat-list" id="chatList" role="listbox" aria-label="Чаты"></ul>

    <button id="fabNew" class="fab" aria-label="Новый чат" title="Новый чат">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </aside>

  <!-- CONVERSATION -->
  <section class="conversation" id="conversation" aria-label="Диалог">
    <div class="empty" id="emptyState">
      <svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity=".35">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      <h2>Выберите чат</h2>
      <p>или начните новый разговор</p>
    </div>

    <header class="conv-header" id="convHeader" hidden>
      <button id="backBtn" class="icon-btn icon-btn--mobile" aria-label="Назад">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="conv-header__avatar" id="convAvatar"></div>
      <div class="conv-header__info">
        <div class="conv-header__name" id="convName"></div>
        <div class="conv-header__status" id="convStatus"></div>
      </div>
      <div class="conv-header__actions">
        <button class="icon-btn" id="callAudioBtn" aria-label="Аудиозвонок" title="Аудиозвонок">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button class="icon-btn" id="callVideoBtn" aria-label="Видеозвонок" title="Видеозвонок">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m23 7-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        </button>
        <button class="icon-btn" id="chatMenuBtn" aria-label="Ещё">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </div>
    </header>

    <div class="pinned" id="pinnedBar" hidden></div>

    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Сообщения"></div>

    <button class="scroll-down" id="scrollDown" hidden aria-label="Вниз">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      <span class="scroll-down__badge" id="scrollDownBadge"></span>
    </button>

    <div class="typing" id="typingIndicator" hidden aria-live="polite">
      <span class="typing__dots"><i></i><i></i><i></i></span>
      <span id="typingName"></span> печатает…
    </div>

    <div class="reply-preview" id="replyPreview" hidden></div>

    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="icon-btn" id="emojiBtn" aria-label="Эмодзи" title="Эмодзи">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/></svg>
      </button>
      <button type="button" class="icon-btn" id="attachBtn" aria-label="Прикрепить" title="Прикрепить">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05 12.25 20.24a6 6 0 1 1-8.49-8.49l8.57-8.57a4 4 0 1 1 5.66 5.66L9.17 17.66a2 2 0 1 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea id="messageInput" class="composer__input" rows="1" placeholder="Сообщение" aria-label="Введите сообщение" maxlength="4096"></textarea>
      <button type="button" class="icon-btn" id="voiceBtn" aria-label="Голосовое" title="Голосовое">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
      </button>
      <button type="submit" class="icon-btn icon-btn--accent" id="sendBtn" aria-label="Отправить" title="Отправить">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>

    <input type="file" id="fileInput" multiple hidden accept="image/*,video/*,audio/*,.pdf,.txt,.zip,.doc,.docx,.mp4,.webm,.mov,.avi,.mkv">
  </section>
</main>

<!-- EMOJI PICKER (portal) -->
<div id="emojiPicker" class="emoji-picker" hidden role="dialog" aria-label="Эмодзи"></div>

<!-- CONTEXT MENU (portal) -->
<div id="contextMenu" class="ctx" hidden role="menu"></div>

<!-- TOASTS -->
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

<!-- MODAL ROOT -->
<div id="modalRoot"></div>

<!-- CALL OVERLAY -->
<div id="callOverlay" class="call" hidden role="dialog" aria-modal="true"></div>

<script type="module" src="js/app.js"></script>
<script>
// Service Worker (ОТКЛЮЧЁН на время разработки)
if (false && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
